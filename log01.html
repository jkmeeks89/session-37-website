DATE: September 18
TIME: 3:10 PM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm


Dr. Elm: Daniel, do you understand why you're here?

Daniel: Yes.

Dr. Elm: Can you explain it in your own words?

Daniel: Something happened. There was an incident.

Dr. Elm: What kind of incident?

Daniel: I don’t… I don’t remember all of it clearly.

Dr. Elm: That’s okay. Start with what you do remember.

Daniel: There was a child.

[Pause — 6 seconds]

Dr. Elm: Go on.

Daniel: She wasn’t supposed to be there.

Dr. Elm: Where?

Daniel: [INAUDIBLE]

Dr. Elm: Daniel?

Daniel: It doesn’t matter.

Dr. Elm: Why not?

Daniel: Because that’s not what this is about.

[Pause — 4 seconds]

Dr. Elm: What is this about?

Daniel: I think something got confused.

Dr. Elm: Confused how?

Daniel: People saw something they didn’t understand.

Dr. Elm: Who saw?

Daniel: My family.

Dr. Elm: Your wife and children?

Daniel: Yes.

Dr. Elm: And what happened after that?

Daniel: I don’t remember clearly.

[NOTE: Subject maintains steady tone. No visible distress.]`;
