<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Session 37</title>

<style>
body {
  margin:0;
  background:black;
  color:#39ff14;
  font-family:monospace;
}

.screen {
  position:absolute;
  width:100%;
  height:100%;
  display:none;
}

.active { display:block; }

.scroll {
  overflow-y:auto;
}

img.bg {
  width:100%;
  height:100%;
  object-fit:contain;
}

.top { position:absolute; top:20px; width:100%; text-align:center; }
.center { position:absolute; top:50%; width:100%; text-align:center; transform:translateY(-50%); }
.left { position:absolute; left:20px; top:20px; white-space:pre-line; max-width:90%; }

.buttons {
  position:absolute;
  bottom:30px;
  width:100%;
  text-align:center;
}

button {
  background:black;
  color:#39ff14;
  border:1px solid #39ff14;
  padding:10px 20px;
  margin:10px;
  cursor:pointer;
}

button:hover {
  background:#39ff14;
  color:black;
}

.home { position:absolute; top:20px; right:20px; }

.code { position:absolute; top:20px; right:20px; color:#555; }
#password {
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  width:100%;
  height:100%;
}
  .active { display:block; }

#password.active {
  display:flex;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="screen active">
<img id="bg" class="bg" src="background1.jpg">
<div id="intro" class="top"></div>
<div id="mid" class="center"></div>

<div id="mainBtns" class="buttons" style="display:none;">
<button onclick="openPage('session')">Session 37</button>
<button onclick="openPage('audio')">Audio Logs</button>
<button onclick="openPage('transcripts')">Transcripts</button>
<button onclick="openPage('password')">Restricted Access</button>
</div>

<div class="code">3801</div>
</div>

<!-- SESSION -->
<div id="session" class="screen scroll">
<button class="home" onclick="goHome()">Home</button>
<div id="sessionText" class="left"></div>
</div>

<!-- AUDIO -->
<div id="audio" class="screen">
<button class="home" onclick="goHome()">Home</button>
<div class="center">

<button onclick="play('Log_one.mp3')">Stevenson_Audio_01</button><br>
<button onclick="play('Log_two.mp3')">Stevenson_Audio_02</button><br>
<button onclick="play('Log_three.mp3')">Stevenson_Audio_03</button><br>
<button onclick="play('Log_four.mp3')">Stevenson_Audio_04</button>

<br><br>

<button onclick="play('SESSION_01_UPLOADED.wav')">SESSION_01_UPLOADED</button><br>
<button onclick="play('SESSION_12_UPLOADED.wav')">SESSION_12_UPLOADED</button><br>
<button onclick="play('SESSION_19_UPLOADED.wav')">SESSION_19_UPLOADED</button><br>
<button onclick="play('SESSION_37_CRITICAL_UPLOADED.wav')">SESSION_37_CRITICAL_UPLOADED</button><br>
<button onclick="play('SESSION_37_POST_UPLOADED.wav')">SESSION_37_POST_UPLOADED</button><br>
<button onclick="play('SESSION_LOCKED_UPLOADED.wav')">SESSION_LOCKED_UPLOADED</button>

</div>
</div>

<!-- TRANSCRIPTS -->
<div id="transcripts" class="screen">
<button class="home" onclick="goHome()">Home</button>
<div id="transTitle" class="top"></div>

<div class="center">
<button onclick="openTranscript(1)">Stevenson_Log_01</button>
<button onclick="openTranscript(2)">Stevenson_Log_02</button>
<button onclick="openTranscript(3)">Stevenson_Log_03</button>
<button onclick="openTranscript(4)">Stevenson_Log_04</button>
</div>
</div>

<div id="transView" class="screen scroll">
<button class="home" onclick="openPage('transcripts')">Transcripts</button>
<div id="transText" class="left"></div>
</div>

<!-- PASSWORD -->
<div id="password" class="screen">
<input id="pass">
<br><br>
<button onclick="checkPass()">Submit</button>
<button onclick="goHome()">Cancel</button>
</div>

<!-- RESTRICTED -->
<div id="restricted" class="screen scroll">
<button class="home" onclick="goHome()">Home</button>
<div id="resText" class="left"></div>
</div>

<audio id="player"></audio>

<script>

document.addEventListener("DOMContentLoaded", function(){

const bg = document.getElementById("bg");
const intro = document.getElementById("intro");
const mid = document.getElementById("mid");
const mainBtns = document.getElementById("mainBtns");
const home = document.getElementById("home");
const player = document.getElementById("player");
const pass = document.getElementById("pass");
const resText = document.getElementById("resText");
const sessionText = document.getElementById("sessionText");
const transText = document.getElementById("transText");

function type(el, text, speed=20){
  el.innerHTML="";
  let i=0;
  function t(){
    if(i<text.length){
      el.innerHTML+=text[i++];
      setTimeout(t,speed);
    }
  }
  t();
}

function typeLines(el, lines){
  el.innerHTML="";
  let i=0;

  function nextLine(){
    if(i>=lines.length) return;

    let lineEl = document.createElement("div");

    if(i===0) lineEl.style.fontSize="34px";
    else lineEl.style.fontSize="20px";

    el.appendChild(lineEl);

    let text = lines[i];
    let c=0;

    function t(){
      if(c<text.length){
        lineEl.innerHTML += text[c++];
        setTimeout(t,20);
      } else {
        i++;
        setTimeout(nextLine,400);
      }
    }

    t();
  }

  nextLine();
}

setTimeout(()=>{
  bg.style.display="none";

  typeLines(intro, [
    "BLACKTHORNE STATE HOSPITAL",
    "Forensic Psychiatry Division",
    "Case File: Daniel Stevenson",
    "Accessing Session Records..."
  ]);

},5000);

setTimeout(()=>{
  intro.innerHTML="";
  type(mid,"Session Records Accessed. Verification Pending...",30);
},12000);

setTimeout(()=>{
  mainBtns.style.display="block";
},17000);

window.openPage = function(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.goHome = function(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  home.classList.add('active');
}

window.play = function(file){
  player.pause();
  player.src=file;
  player.load();
  player.play().catch(()=>{});
}

// SESSION TEXT
const sessionFull = `SESSION 37 Primary Case File

SUBJECT: Daniel Stevenson AGE: 34 STATUS: In Custody

EVALUATING PSYCHOLOGIST: Dr. Victor Elm
FACILITY: Blackthorne State Hospital
DIVISION: Forensic Psychiatry

CASE SUMMARY:

On March 14th, Detective Harper Smith along with two officers entered the home of Daniel Stevenson in order to charge him with the murders of his wife, Caroline Stevenson, and their two children, Bradley and Sarah Stevenson.

Upon arrival:

No bodies were recovered
Daniel Stevenson found in fetal postion beside bathtub
No signs of forced entry
No indication of external involvement
Subject was found on site.

No attempt to flee.

No visible distress.

INITIAL STATEMENT:

“I don’t remember.”

Statement repeated multiple times during intake.

OBSERVATION NOTES:

Subject remains cooperative during sessions
Displays minimal emotional response when discussing incident
Demonstrates intermittent disorientation
Reports auditory experiences involving victims
Subject insists:

“They’re still here.”

SESSION STATUS:

Session 37 ongoing.

Progress: Inconclusive

Recommendation: Continued evaluation required.`;

document.querySelector("[onclick=\"openPage('session')\"]")
.addEventListener("click",()=>{
  setTimeout(()=>type(sessionText, sessionFull,10),100);
});

// TRANSCRIPTS
const transcripts = {
1:`SESSION ID: 01 DATE: September 18 TIME: 3:10 PM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: Daniel, do you understand why you're here?

Daniel: Yes.

Dr. Elm: Can you explain it in your own words?

Daniel: Something happened. There was an incident.

Dr. Elm: What kind of incident?

Daniel: I don’t… I don’t remember all of it clearly.

Dr. Elm: That’s okay. Start with what you do remember.

Daniel: There was a child.

[Pause — 6 seconds]

Dr. Elm: Go on.

Daniel: She wasn’t supposed to be there.

Dr. Elm: Where?

Daniel: [INAUDIBLE]

Dr. Elm: Daniel?

Daniel: It doesn’t matter.

Dr. Elm: Why not?

Daniel: Because that’s not what this is about.

[Pause — 4 seconds]

Dr. Elm: What is this about?

Daniel: I think something got confused.

Dr. Elm: Confused how?

Daniel: People saw something they didn’t understand.

Dr. Elm: Who saw?

Daniel: My family.

Dr. Elm: Your wife and children?

Daniel: Yes.

Dr. Elm: And what happened after that?

Daniel: I don’t remember clearly.

[NOTE: Subject maintains steady tone. No visible distress.]`,
2:`SESSION ID: 12 DATE: September 26 TIME: 11:42 AM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: Last time you mentioned your family witnessing something. Do you remember more now?

Daniel: Pieces.

Dr. Elm: Let’s go through it slowly.

Daniel: They came in too early.

Dr. Elm: Into what?

Daniel: The room.

Dr. Elm: Which room?

Daniel: [INAUDIBLE]

Dr. Elm: You can say it.

Daniel: I’d rather not.

Dr. Elm: Why?

Daniel: Because it makes it sound worse than it was.

[Pause — 5 seconds]

Dr. Elm: What did they see?

Daniel: The girl.

Dr. Elm: Doing what?

Daniel: Nothing.

Dr. Elm: Daniel—

Daniel: She wasn’t doing anything.

[Pause — 3 seconds]

Dr. Elm: What was your family’s reaction?

Daniel: They were scared.

Dr. Elm: Of you?

Daniel: I don’t know.

Dr. Elm: You said before they “didn’t understand.” What didn’t they understand?

Daniel: That it wasn’t what it looked like.

Dr. Elm: And what did it look like?

Daniel: [REDACTED]

[Pause — 8 seconds]

Dr. Elm: What happened next?

Daniel: I told them to stop.

Dr. Elm: Stop what?

Daniel: Talking. Crying. Moving.

Dr. Elm: Why?

Daniel: Because it was getting loud.`,
3:`SESSION ID: 19 DATE: October 3 TIME: 2:18 PM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: You said things were “getting loud.” Can you explain that?

Daniel: It wasn’t loud like yelling.

Dr. Elm: Then how?

Daniel: It was constant.

Dr. Elm: What was?

Daniel: The sound.

Dr. Elm: What sound?

Daniel: Crying.

[Pause — 4 seconds]

Dr. Elm: From who?

Daniel: All of them.

Dr. Elm: Your children?

Daniel: Yes.

Dr. Elm: And your wife?

Daniel: Yes.

Dr. Elm: What did you do?

Daniel: I tried to calm them down.

Dr. Elm: How?

Daniel: I told them everything was fine.

Dr. Elm: Was it?

Daniel: Yes.

[Pause — 6 seconds]

Dr. Elm: Daniel.

Daniel: It was supposed to be.

Dr. Elm: What happened after you tried to calm them?

Daniel: [INAUDIBLE]

Dr. Elm: Can you repeat that?

Daniel: I don’t want to.

Dr. Elm: Why not?

Daniel: Because you’ll hear it wrong.

Dr. Elm: Try anyway.

Daniel: [REDACTED]

[Pause — 10 seconds]

Dr. Elm: Did anyone try to leave?

Daniel: No.

Dr. Elm: Are you sure?

Daniel: Yes.

[NOTE: Audio irregularities reported during this segment. Not present during live session.]`,
4:`SESSION ID: 37 DATE: October 14 TIME: 8:42 PM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: Daniel, we’re going to revisit the events one more time.

[Pause — 3 seconds]

Dr. Elm: Do you understand?

Daniel: Yes.

Dr. Elm: What happened that night?

[Pause — 9 seconds]

Daniel: They saw.

Dr. Elm: Who?

Daniel: All of them.

Dr. Elm: And then?

Daniel: They wouldn’t stop.

Dr. Elm: Stop what?

Daniel: Looking at me.

[Pause — 5 seconds]

Dr. Elm: What did you do?

Daniel: I fixed it.

Dr. Elm: How?

[Pause — 12 seconds]

Daniel: I made it quiet.

[Silence — 14 seconds]

Dr. Elm: Daniel… what does that mean?

Daniel: It means it stopped.

Dr. Elm: What stopped?

Daniel: Everything.

[Pause — 6 seconds]

Dr. Elm: Do you regret what happened?

Daniel: I don’t know.

Dr. Elm: Do you remember it clearly now?

Daniel: Yes.

Dr. Elm: And?

[Pause — 11 seconds]

Daniel: It doesn’t sound the same when I say it out loud.

Dr. Elm: What doesn’t?

Daniel: The truth.

[NOTE: Subject no longer disputes involvement. Emotional response minimal.]`
};

window.openTranscript = function(n){
  openPage('transView');
  setTimeout(()=>type(transText, transcripts[n],10),100);
}

// PASSWORD
window.checkPass = function(){
  if(pass.value==="3801"){
    openPage('restricted');
    runRestricted();
  }
}

// RESTRICTED
function runRestricted(){

let lines = [
"Initializing secure environment...",
"Loading kernel modules...",
"Mounting /dev/sda1 → /secure",
"Checking permissions...",
"Permission override detected",
"Authenticating user...",
"ACCESS LEVEL: UNKNOWN",
"Attempting escalation...",
"Escalation successful",
"Bypassing audit logs...",
"Injecting session key...",
"Key accepted"
];

let i=0;

function next(){
  if(i<lines.length){

    resText.style.position="absolute";
    resText.style.top="20px";
    resText.style.left="20px";
    resText.style.transform="none";
    resText.style.textAlign="left";

    resText.innerHTML += lines[i++] + "\n";
    setTimeout(next,25);

  } else {
    setTimeout(showAccess,5000);
  }
}

resText.innerHTML="";
next();
}

function showAccess(){

  resText.style.position="absolute";
  resText.style.top="50%";
  resText.style.left="50%";
  resText.style.transform="translate(-50%, -50%)";
  resText.style.textAlign="center";

  resText.innerHTML="Access Granted";

  setTimeout(showFinal,3000);
}

function showFinal(){

  resText.style.position="absolute";
  resText.style.top="20px";
  resText.style.left="20px";
  resText.style.transform="none";
  resText.style.textAlign="left";

  resText.innerHTML = `
CLEARANCE LEVEL: RESTRICTED

FILE: INTERNAL REVIEW

[Audio_File_Detected]

[Session_38_Audio]

<br><br>
<button onclick="play('Restricted.mp3')">Play Audio</button>
`;
}

type(document.getElementById("transTitle"),
"TRANSCRIPT ARCHIVE\nCase File: Daniel Reeves\nStatus: Active Evaluation");

});

</script>

</body>
</html>
