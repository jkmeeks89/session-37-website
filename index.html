<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blackthorne State Hospital</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="code">3801</div>

  <img id="bg" class="bg-image" src="assets/Background%201.png" alt="">

  <div id="topText"></div>

  <div id="buttons" class="button-row">
    <a class="btn" href="session37.html">Session 37</a>
    <a class="btn" href="audiologs.html">Audio Logs</a>
    <a class="btn" href="transcripts.html">Transcripts</a>
    <a class="btn" href="restricted.html">Restricted Access</a>
  </div>

  <script src="typer.js"></script>
  <script>
    const text1 = "BLACKTHORNE STATE HOSPITAL\nForensic Psychiatry Division\n\nCase File: Daniel Stevenson\n\nAccessing Session Records...";
    const text2 = "Session Records Accessed.\nVerification Pending...";

    const bg = document.getElementById('bg');
    const topText = document.getElementById('topText');
    const buttons = document.getElementById('buttons');

    // Step 1: show background for 5s, then fade
    setTimeout(() => {
      bg.classList.add('hidden');
      // Step 2: type first text
      typeText(topText, text1, 35, () => {
        // Step 3: hold for 7s, then clear and type second text
        setTimeout(() => {
          topText.textContent = '';
          typeText(topText, text2, 40, () => {
            // Step 4: reveal buttons
            setTimeout(() => buttons.classList.add('visible'), 400);
          });
        }, 7000);
      });
    }, 5000);
  </script>
</body>
</html>
