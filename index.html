<script>

// TYPE (supports multi-line timing)
function typeLines(el, lines, speed=25, lineDelay=400){
  el.innerHTML = "";
  let i = 0;

  function nextLine(){
    if(i >= lines.length) return;

    let line = lines[i];
    let charIndex = 0;
    let lineEl = document.createElement("div");

    // make first line bigger
    if(i === 0) lineEl.style.fontSize = "34px";
    else lineEl.style.fontSize = "20px";

    el.appendChild(lineEl);

    function typeChar(){
      if(charIndex < line.length){
        lineEl.innerHTML += line[charIndex++];
        setTimeout(typeChar, speed);
      } else {
        i++;
        setTimeout(nextLine, lineDelay);
      }
    }

    typeChar();
  }

  nextLine();
}
