<!DOCTYPE html>

<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackthorne System</title>

<style>
body{
  margin:0;
  font-family:monospace;
  color:#39ff14;
  background:black;
}

/* BACKGROUND IMAGE FULL SCREEN NO CROP */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:url("background1.jpg") no-repeat center center;
  background-size:contain;
  z-index:-1;
}

/* SCREEN SYSTEM */
.screen{
  display:none;
  width:100%;
  height:100vh;
  overflow:auto;
}
.active{ display:block; }

/* TEXT POSITIONS */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
}
.left{
  position:absolute;
  top:20px;
  left:20px;
  right:20px;
  white-space:pre-line;
  line-height:1.5;
}

/* BUTTONS */
.buttons{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
}
button{
  background:black;
  color:#39ff14;
  border:1px solid #39ff14;
  padding:16px 26px;
  margin:8px;
  font-size:16px;
  cursor:pointer;
}
button:hover{
  background:#39ff14;
  color:black;
}

/* TOP RIGHT */
.topRight{
  position:absolute;
  top:10px;
  right:15px;
  color:#777;
}
.home{
  position:absolute;
  top:10px;
  right:15px;
  cursor:pointer;
}

/* GRID */
.grid{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* PASSWORD */
#passwordBox{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
input{
  background:black;
  color:#39ff14;
  border:1px solid #39ff14;
  padding:10px;
}
.fade{
  opacity:0;
  transition:1.5s;
}
.glitch{
  position:relative;
  animation:glitch 0.2s infinite;
}

@keyframes glitch{
  0%{text-shadow:2px 0 red,-2px 0 blue;}
  20%{text-shadow:-2px 0 red,2px 0 blue;}
  40%{text-shadow:2px 2px red,-2px -2px blue;}
  60%{text-shadow:-2px -2px red,2px 2px blue;}
  80%{text-shadow:2px 0 red,-2px 0 blue;}
  100%{text-shadow:none;}
}

/* SCREEN FLASH */
.flash{
  animation:flash 0.2s;
}

@keyframes flash{
  0%{background:white;}
  100%{background:transparent;}
}

/* FLICKER */
body.flicker{
  animation:flicker 0.1s infinite;
}

@keyframes flicker{
  0%{opacity:1;}
  50%{opacity:0.85;}
  100%{opacity:1;}
}

</style>

</head>

<body>

<!-- HOME -->

<div id="home" class="screen active">
<div class="topRight">3801</div>
<div id="intro" class="center"></div>

<div id="mainBtns" class="buttons" style="display:none;">
<button onclick="loadSession()">Session 37</button>
<button onclick="openPage('audio')">Audio Logs</button>
<button onclick="openPage('transcripts')">Transcripts</button>
<button onclick="openPage('files')">Case Files</button>
<button onclick="showPassword()">Restricted Access</button>
</div>
</div>

<!-- SESSION -->

<div id="session" class="screen">
<div class="home" onclick="goHome()">Home</div>
<div id="sessionText" class="left"></div>
</div>

<!-- AUDIO -->

<div id="audio" class="screen">
<div class="home" onclick="goHome()">Home</div>

<div class="grid">
<div>
<button onclick="play('Log_one.mp3')">Stevenson_Audio_01</button>
<button onclick="play('Log_two.mp3')">Stevenson_Audio_02</button>
<button onclick="play('SESSION_01_UPLOADED.m4a')">SESSION_01</button>
<button onclick="play('SESSION_12_UPLOADED.m4a')">SESSION_12</button>
<button onclick="play('SESSION_19_UPLOADED.m4a')">SESSION_19</button>
</div>

<div>
<button onclick="play('Log_three.mp3')">Stevenson_Audio_03</button>
<button onclick="play('Log_four.mp3')">Stevenson_Audio_04</button>
<button onclick="play('SESSION_37_CRITICAL_UPLOADED.m4a')">SESSION_37_CRITICAL</button>
<button onclick="play('SESSION_37_POST_UPLOADED.m4a')">SESSION_37_POST</button>
<button onclick="play('SESSION_LOCKED_UPLOADED.m4a')">SESSION_LOCKED</button>
</div>
</div>
</div>

<!-- TRANSCRIPTS -->

<div id="transcripts" class="screen">
<div class="home" onclick="goHome()">Home</div>
<div id="transHeader" class="center"></div>

<div class="grid">
<button onclick="openTranscript(1)">Stevenson_Log_01</button>
<button onclick="openTranscript(3)">Stevenson_Log_03</button>
<button onclick="openTranscript(2)">Stevenson_Log_02</button>
<button onclick="openTranscript(4)">Stevenson_Log_04</button>
</div>
</div>

<!-- TRANS VIEW -->

<div id="transView" class="screen">
<div class="home" onclick="openPage('transcripts')">Transcripts</div>
<div id="transText" class="left"></div>
</div>

<!-- FILES -->

<div id="files" class="screen">
<div class="home" onclick="goHome()">Home</div>
<div class="center">
<h2>CASE FILE ARCHIVE</h2>
<p>[Documents Coming Soon]</p>
</div>
</div>

<!-- PASSWORD -->

<div id="password" class="screen">
<div id="passwordBox">
<input id="pass"><br><br>
<button onclick="checkPass()">Submit</button>
<button onclick="goHome()">Cancel</button>
</div>
</div>

<!-- RESTRICTED -->

<div id="restricted" class="screen">
<div class="home" onclick="goHome()">Home</div>
<div id="resText" class="left"></div>
</div>

<audio id="player"></audio>

<script>
document.addEventListener("DOMContentLoaded", function(){
const intro = document.getElementById("intro");
const mainBtns = document.getElementById("mainBtns");
const transHeader = document.getElementById("transHeader");
const transText = document.getElementById("transText");
const sessionText = document.getElementById("sessionText");
const resText = document.getElementById("resText");
const pass = document.getElementById("pass");

let audioCtx;
let sourceNode;
let gainNode;
let distortionNode;

function initAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function createDistortion(amount=50){
  let curve = new Float32Array(44100);
  let k = amount;
  let deg = Math.PI / 180;

  for(let i=0;i<44100;i++){
    let x = i*2/44100-1;
    curve[i]=(3+k)*x*20*deg/(Math.PI+k*Math.abs(x));
  }
  return curve;
}

/* NAV */
function openPage(id){

  document.body.classList.add("flash");
glitchAudio();
  
  setTimeout(()=>{
    document.body.classList.remove("flash");
  },150);

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){ openPage('home'); }

/* AUDIO */
function play(file){

  initAudio();

  const audio = document.getElementById('player');
  audio.src = file;
  audio.load();

  if(sourceNode){
    sourceNode.disconnect();
  }
  

  sourceNode = audioCtx.createMediaElementSource(audio);

  gainNode = audioCtx.createGain();
  distortionNode = audioCtx.createWaveShaper();

  distortionNode.curve = createDistortion(0);
  distortionNode.oversample = '4x';

  sourceNode.connect(distortionNode);
  distortionNode.connect(gainNode);
  gainNode.connect(audioCtx.destination);

  audio.play().catch(()=>{});
}

function glitchAudio(){

  if(!distortionNode) return;

  distortionNode.curve = createDistortion(400);
  gainNode.gain.value = 0.6;

  setTimeout(()=>{
    distortionNode.curve = createDistortion(0);
    gainNode.gain.value = 1;
  },200);
}

function staticBurst(){

  if(!audioCtx) return;

  let bufferSize = audioCtx.sampleRate * 0.2;
  let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  let data = buffer.getChannelData(0);

  for(let i=0;i<bufferSize;i++){
    data[i] = Math.random()*2-1;
  }

  let noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  let noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.2;

  noise.connect(noiseGain);
  noiseGain.connect(audioCtx.destination);

  noise.start();
}

/* TYPE */
function type(el,text,speed=20,cb){
let i=0;
el.innerHTML="";
function t(){
if(i<text.length){
el.innerHTML+=text[i++];
setTimeout(t,speed);
}else if(cb){cb();}
}
t();
}

/* INTRO */
setTimeout(()=>{
type(document.getElementById('intro')
"BLACKTHORNE STATE HOSPITAL\n\nForensic Psychiatry Division\nCase File: Daniel Stevenson\nAccessing Session Records...",
20,()=>{

  intro.classList.add("glitch");

glitchAudio();
staticBurst();

  setTimeout(()=>{
    intro.classList.remove("glitch");
  },1200);

  setTimeout(()=>{
intro.classList.add("fade");
setTimeout(()=>{
intro.classList.remove("fade");
type(intro,
"Session Records Accessed.\nVerification Pending...",20,()=>{
document.getElementById('mainBtns').style.display="block";
});
},1500);
},7000);
});
},3000);

/* SESSION */
function loadSession(){
openPage('session');
type(sessionText,`SESSION 37 Primary Case File

SUBJECT: Daniel Stevenson AGE: 34 STATUS: In Custody

EVALUATING PSYCHOLOGIST: Dr. Victor Elm FACILITY: Blackthorne State Hospital DIVISION: Forensic Psychiatry

CASE SUMMARY:

On March 14th, Detective Harper Smith along with two officers entered the home of Daniel Stevenson in order to charge him with the murders of his wife, Caroline Stevenson, and their two children, Bradley and Sarah Stevenson.

Upon arrival:

No bodies were recovered
Daniel Stevenson found in fetal postion beside bathtub
No signs of forced entry
No indication of external involvement
Subject was found on site.

No attempt to flee.

No visible distress.

INITIAL STATEMENT:

“I don’t remember.”

Statement repeated multiple times during intake.

OBSERVATION NOTES:

Subject remains cooperative during sessions
Displays minimal emotional response when discussing incident
Demonstrates intermittent disorientation
Reports auditory experiences involving victims
Subject insists:

“They’re still here.”

SESSION STATUS:

Session 37 ongoing.

Progress: Inconclusive

Recommendation: Continued evaluation required.`,10);
}

/* TRANS HEADER */
type(document.getElementById('transHeader'),"TRANSCRIPT ARCHIVE\nCase File: Daniel Reeves\nStatus: Active Evaluation");

/* TRANSCRIPTS */
const transcripts = {

1: `SESSION ID: 01
DATE: September 18
TIME: 3:10 PM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm

Dr. Elm: Daniel, do you understand why you're here?
Daniel: Yes.
`,

2: `SESSION ID: 12
DATE: September 26
TIME: 11:42 AM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm

Dr. Elm: Last time you mentioned your family...
Daniel: Pieces.
`,

3: `SESSION ID: 19
DATE: October 3
TIME: 2:18 PM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm

Dr. Elm: You said things were getting loud...
Daniel: It wasn’t loud like yelling.
`,

4: `SESSION ID: 37
DATE: October 14
TIME: 8:42 PM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm

Dr. Elm: What happened that night?
Daniel: They saw.
`

};

function openTranscript(n){
openPage('transView');
type(transText,transcripts[n],10);
}

/* PASSWORD */
function showPassword(){ openPage('password'); }
function checkPass(){
if(pass.value==="3801"){
runRestricted();
}
}

/* RESTRICTED */
function runRestricted(){
openPage('restricted');
document.body.classList.add("flicker");

setTimeout(()=>{
  document.body.classList.remove("flicker");
},4000);
let lines=[
"Initializing secure environment...", 
"Loading kernel modules...", 
"Mounting /dev/sda1 → /secure", 
"Checking permissions...", 
"Permission override detected", 
"Authenticating user...", 
"ACCESS LEVEL: UNKNOWN", 
"Attempting escalation...", 
"Escalation successful", 
"Bypassing audit logs...", 
"Injecting session key...", 
"Key accepted", 
"Accessing internal directories...", 
"cd /var/restricted/", 
"ls -la", 
"-rw-r--r-- session_log_12.dat", 
"-rw-r--r-- session_log_19.dat", 
"-rw-r--r-- session_log_37.dat", 
"-rw-r--r-- session_log_38.dat", 
"Opening file: session_log_37.dat", 
"ERROR: file integrity compromised", 
"Retrying...", 
"Opening file: session_log_37.dat", 
"WARNING: unauthorized trace detected", 
"Continuing anyway...", 
"Extracting data stream...", 
"Decryption failed", 
"Applying fallback method...", 
"Partial reconstruction complete", 
">>> anomaly detected <<<",

"attempting recovery...", 
"FAILED", 
"Preparing display buffer..."
];
let i=0;

function next(){
if(i<lines.length){
resText.innerHTML+=lines[i++]+"\\n";
setTimeout(next,40);
}else{
setTimeout(()=>{
resText.innerHTML="Access Granted";
setTimeout(()=>{
  document.body.classList.add("flash");
  setTimeout(()=>document.body.classList.remove("flash"),100);
},500);
resText.classList.add("glitch");
glitchAudio();
staticBurst();

setTimeout(()=>{
  resText.classList.remove("glitch");
},1500);
resText.innerHTML=`CLEARANCE LEVEL: RESTRICTED

FILE: INTERNAL REVIEW SUBJECT: Daniel Stevenson AUTHORIZED PERSONNEL ONLY

INTERNAL NOTE:

The following material was not included in the official case file.

Reason: Inconsistencies in recorded sessions.

ANOMALY REPORT:

Multiple recordings contain audio not present during live sessions.

Review confirms:

Audio artifacts consistent across multiple logs
Conclusion:

SUPPLEMENTAL INTERVIEW EXCERPT:

Dr. Victor Elm: Why didn’t you stop?

Daniel Stevenson: They wouldn’t stop.

Dr. Victor Elm: What do you mean?

Daniel Stevenson: The crying.

Dr. Victor Elm: And what did you do?

[Pause — 12 seconds]

Daniel Stevenson: I made it quiet.

CASE NOTE:

No signs of forced entry.

No defensive wounds.

No evidence of struggle.

FINAL OBSERVATION:

Subject no longer denies involvement.

Subject no longer asks what happened.

Subject only asks:

“Can you still hear them?”







[Audio_File_Detected]
[Session_38_Audio]

<button onclick="play('Restricted.mp3')">Play Audio</button>`;

},3000);

next();
}

});

</script>

</body>
</html>
