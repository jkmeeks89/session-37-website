<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackthorne System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:black;
font-family:monospace;
color:#39ff14;
}

body::before{
content:"";
position:fixed;
inset:0;
background:url('background1.jpg') no-repeat center center;
background-size:contain;
z-index:-5;
background-color:black;
}

.screen{
display:none;
position:absolute;
inset:0;
width:100%;
height:100dvh;
overflow-y:auto;
padding:20px;
}

.active{
display:block;
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
width:90%;
line-height:1.7;
font-size:clamp(18px,2vw,30px);
white-space:pre-line;
}

.leftText{
white-space:pre-wrap;
line-height:1.7;
font-size:clamp(14px,1.5vw,20px);
padding-top:60px;
padding-bottom:100px;
}

.topRight{
position:absolute;
top:12px;
right:18px;
color:#777;
font-size:14px;
}

.homeBtn{
position:absolute;
top:12px;
right:18px;
z-index:50;
}

.bottomButtons{
position:absolute;
bottom:30px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-wrap:wrap;
gap:14px;
justify-content:center;
width:95%;
}

button{
background:black;
color:#39ff14;
border:1px solid #39ff14;
padding:14px 24px;
font-size:16px;
cursor:pointer;
font-family:monospace;
min-width:180px;
}

button:hover{
background:#39ff14;
color:black;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
max-width:900px;
margin:120px auto;
width:100%;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}

button{
width:100%;
}
}

.fade{
animation:fadeOut 1.5s forwards;
}

@keyframes fadeOut{
from{opacity:1;}
to{opacity:0;}
}

.glitch{
animation:glitch .15s infinite;
}

@keyframes glitch{
0%{transform:translate(0px,0px);}
25%{transform:translate(2px,-1px);}
50%{transform:translate(-2px,1px);}
75%{transform:translate(1px,2px);}
100%{transform:translate(0px,0px);}
}

.flash{
animation:flash .2s;
}

@keyframes flash{
0%{opacity:1;}
100%{opacity:1;}
}

#passwordBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

input{
background:black;
color:#39ff14;
border:1px solid #39ff14;
padding:12px;
font-size:18px;
margin-bottom:15px;
width:250px;
font-family:monospace;
}

.casePlaceholder{
margin-top:120px;
line-height:2;
font-size:18px;
}

.audioPlayer{
position:fixed;
bottom:10px;
left:50%;
transform:translateX(-50%);
width:90%;
max-width:700px;
}
</style>
</head>
<body>

<audio id="player" style="display:none;"></audio>

<div id="home" class="screen active">
<div class="topRight">3801</div>
<div id="intro" class="center"></div>

<button onclick="loadSession()">Session 37</button>
<button onclick="openPage('audioPage')">Audio Logs</button>
<button onclick="openPage('transcriptsPage')">Transcripts</button>
<button onclick="openPage('filesPage')">Case Files</button>
<button onclick="showPassword()">Restricted Access</button>
</div>
</div>

<div id="sessionPage" class="screen">
<button class="homeBtn" onclick="goHome()">Home</button>
<div id="sessionText" class="leftText"></div>
</div>

<div id="audioPage" class="screen">
<button class="homeBtn" onclick="goHome()">Home</button>

<div class="grid">
<div>
<button onclick="playAudio('Log_one.mp3')">Stevenson_Audio_01</button><br><br>
<button onclick="playAudio('Log_two.mp3')">Stevenson_Audio_02</button><br><br>
<button onclick="playAudio('SESSION_01_UPLOADED.m4a')">SESSION_01_UPLOADED</button><br><br>
<button onclick="playAudio('SESSION_12_UPLOADED.m4a')">SESSION_12_UPLOADED</button><br><br>
<button onclick="playAudio('SESSION_19_UPLOADED.m4a')">SESSION_19_UPLOADED</button>
</div>

<div>
<button onclick="playAudio('Log_three.mp3')">Stevenson_Audio_03</button><br><br>
<button onclick="playAudio('Log_four.mp3')">Stevenson_Audio_04</button><br><br>
<button onclick="playAudio('SESSION_37_CRITICAL_UPLOADED.m4a')">SESSION_37_CRITICAL_UPLOADED</button><br><br>
<button onclick="playAudio('SESSION_37_POST_UPLOADED.m4a')">SESSION_37_POST_UPLOADED</button><br><br>
<button onclick="playAudio('SESSION_LOCKED_UPLOADED.m4a')">SESSION_LOCKED_UPLOADED</button>
</div>
</div>
</div>

<div id="transcriptsPage" class="screen">
<button class="homeBtn" onclick="goHome()">Home</button>
<div id="transHeader" class="center" style="top:100px;"></div>

<div class="grid" style="margin-top:220px;">
<button onclick="openTranscript(1)">Stevenson_Log_01</button>
<button onclick="openTranscript(3)">Stevenson_Log_03</button>
<button onclick="openTranscript(2)">Stevenson_Log_02</button>
<button onclick="openTranscript(4)">Stevenson_Log_04</button>
</div>
</div>

<div id="transcriptViewer" class="screen">
<button class="homeBtn" onclick="openPage('transcriptsPage')">Transcripts</button>
<div id="transcriptText" class="leftText"></div>
</div>

<div id="filesPage" class="screen">
<button class="homeBtn" onclick="goHome()">Home</button>
<div class="casePlaceholder">
<h1>CASE FILE ARCHIVE</h1>
<br>
<p>Documents Coming Soon...</p>
<p>Psychological Reports Pending Upload...</p>
<p>Autopsy Records Pending...</p>
<p>Scene Documentation Pending...</p>
</div>
</div>

<div id="passwordPage" class="screen">
<div id="passwordBox">
<input type="password" id="passInput" placeholder="ENTER PASSWORD">
<br>
<button onclick="checkPassword()">Submit</button>
<button onclick="goHome()">Cancel</button>
</div>
</div>

<div id="restrictedPage" class="screen">
<button class="homeBtn" onclick="goHome()">Home</button>
<div id="restrictedText" class="leftText"></div>
</div>

<script>
const player = document.getElementById('player');

function openPage(id){
document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
window.scrollTo(0,0);
}

function goHome(){
openPage('home');
}

function playAudio(file){
player.pause();
player.src=file;
player.load();
player.play().catch(()=>{});
}

function typeText(el,text,speed=20,callback){
el.innerHTML='';
let i=0;

function typing(){
if(i<text.length){
el.innerHTML += text.charAt(i);
i++;
setTimeout(typing,speed);
}else if(callback){
callback();
}
}

typing();
}

setTimeout(()=>{

typeText(
document.getElementById('intro'),
'BLACKTHORNE STATE HOSPITAL\n\nForensic Psychiatry Division\nCase File: Daniel Stevenson\n\nAccessing Session Records...',
20,
()=>{

setTimeout(()=>{
const intro=document.getElementById('intro');
intro.classList.add('fade');

setTimeout(()=>{
intro.classList.remove('fade');

typeText(
intro,
'Session Records Accessed.\nVerification Pending...',
20,
()=>{
document.getElementById('mainButtons').style.display='flex';
}
);

},1500);

},7000);

}
);

},3000);

function loadSession(){
openPage('sessionPage');

typeText(
document.getElementById('sessionText'),
`SESSION 37 Primary Case File

SUBJECT: Daniel Stevenson AGE: 34 STATUS: In Custody

EVALUATING PSYCHOLOGIST: Dr. Victor Elm FACILITY: Blackthorne State Hospital DIVISION: Forensic Psychiatry

CASE SUMMARY:

On March 14th, Detective Harper Smith along with two officers entered the home of Daniel Stevenson in order to charge him with the murders of his wife, Caroline Stevenson, and their two children, Bradley and Sarah Stevenson.

Upon arrival:

No bodies were recovered
Daniel Stevenson found in fetal postion beside bathtub
No signs of forced entry
No indication of external involvement
Subject was found on site.

No attempt to flee.

No visible distress.

INITIAL STATEMENT:

“I don’t remember.”

Statement repeated multiple times during intake.

OBSERVATION NOTES:

Subject remains cooperative during sessions
Displays minimal emotional response when discussing incident
Demonstrates intermittent disorientation
Reports auditory experiences involving victims
Subject insists:

“They’re still here.”

SESSION STATUS:

Session 37 ongoing.

Progress: Inconclusive

Recommendation: Continued evaluation required.`,
5
);
}

const transcripts={
1:`SESSION ID: 01 DATE: September 18 TIME: 3:10 PM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: Daniel, do you understand why you're here?

Daniel: Yes.

Dr. Elm: Can you explain it in your own words?

Daniel: Something happened. There was an incident.

Dr. Elm: What kind of incident?

Daniel: I don’t… I don’t remember all of it clearly.

Dr. Elm: That’s okay. Start with what you do remember.

Daniel: There was a child.

[Pause — 6 seconds]

Dr. Elm: Go on.

Daniel: She wasn’t supposed to be there.

Dr. Elm: Where?

Daniel: [INAUDIBLE]

Dr. Elm: Daniel?

Daniel: It doesn’t matter.

Dr. Elm: Why not?

Daniel: Because that’s not what this is about.

[Pause — 4 seconds]

Dr. Elm: What is this about?

Daniel: I think something got confused.

Dr. Elm: Confused how?

Daniel: People saw something they didn’t understand.

Dr. Elm: Who saw?

Daniel: My family.

Dr. Elm: Your wife and children?

Daniel: Yes.

Dr. Elm: And what happened after that?

Daniel: I don’t remember clearly.

[NOTE: Subject maintains steady tone. No visible distress.]`,

2:`SESSION ID: 12 DATE: September 26 TIME: 11:42 AM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: Last time you mentioned your family witnessing something. Do you remember more now?

Daniel: Pieces.

Dr. Elm: Let’s go through it slowly.

Daniel: They came in too early.

Dr. Elm: Into what?

Daniel: The room.

Dr. Elm: Which room?

Daniel: [INAUDIBLE]

Dr. Elm: You can say it.

Daniel: I’d rather not.

Dr. Elm: Why?

Daniel: Because it makes it sound worse than it was.

[Pause — 5 seconds]

Dr. Elm: What did they see?

Daniel: The girl.

Dr. Elm: Doing what?

Daniel: Nothing.

Dr. Elm: Daniel—

Daniel: She wasn’t doing anything.

[Pause — 3 seconds]

Dr. Elm: What was your family’s reaction?

Daniel: They were scared.

Dr. Elm: Of you?

Daniel: I don’t know.

Dr. Elm: You said before they “didn’t understand.” What didn’t they understand?

Daniel: That it wasn’t what it looked like.

Dr. Elm: And what did it look like?

Daniel: [REDACTED]

[Pause — 8 seconds]

Dr. Elm: What happened next?

Daniel: I told them to stop.

Dr. Elm: Stop what?

Daniel: Talking. Crying. Moving.

Dr. Elm: Why?

Daniel: Because it was getting loud.

[NOTE: Subject shows increased agitation when discussing auditory elements.]`,

3:`SESSION ID: 19 DATE: October 3 TIME: 2:18 PM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: You said things were “getting loud.” Can you explain that?

Daniel: It wasn’t loud like yelling.

Dr. Elm: Then how?

Daniel: It was constant.

Dr. Elm: What was?

Daniel: The sound.

Dr. Elm: What sound?

Daniel: Crying.

[Pause — 4 seconds]

Dr. Elm: From who?

Daniel: All of them.

Dr. Elm: Your children?

Daniel: Yes.

Dr. Elm: And your wife?

Daniel: Yes.

Dr. Elm: What did you do?

Daniel: I tried to calm them down.

Dr. Elm: How?

Daniel: I told them everything was fine.

Dr. Elm: Was it?

Daniel: Yes.

[Pause — 6 seconds]

Dr. Elm: Daniel.

Daniel: It was supposed to be.

Dr. Elm: What happened after you tried to calm them?

Daniel: [INAUDIBLE]

Dr. Elm: Can you repeat that?

Daniel: I don’t want to.

Dr. Elm: Why not?

Daniel: Because you’ll hear it wrong.

Dr. Elm: Try anyway.

Daniel: [REDACTED]

[Pause — 10 seconds]

Dr. Elm: Did anyone try to leave?

Daniel: No.

Dr. Elm: Are you sure?

Daniel: Yes.

[NOTE: Audio irregularities reported during this segment. Not present during live session.]`,

4:`SESSION ID: 37 DATE: October 14 TIME: 8:42 PM

SUBJECT: Daniel Stevenson INTERVIEWER: Dr. Victor Elm

Dr. Elm: Daniel, we’re going to revisit the events one more time.

[Pause — 3 seconds]

Dr. Elm: Do you understand?

Daniel: Yes.

Dr. Elm: What happened that night?

[Pause — 9 seconds]

Daniel: They saw.

Dr. Elm: Who?

Daniel: All of them.

Dr. Elm: And then?

Daniel: They wouldn’t stop.

Dr. Elm: Stop what?

Daniel: Looking at me.

[Pause — 5 seconds]

Dr. Elm: What did you do?

Daniel: I fixed it.

Dr. Elm: How?

[Pause — 12 seconds]

Daniel: I made it quiet.

[Silence — 14 seconds]

Dr. Elm: Daniel… what does that mean?

Daniel: It means it stopped.

Dr. Elm: What stopped?

Daniel: Everything.

[Pause — 6 seconds]

Dr. Elm: Do you regret what happened?

Daniel: I don’t know.

Dr. Elm: Do you remember it clearly now?

Daniel: Yes.

Dr. Elm: And?

[Pause — 11 seconds]

Daniel: It doesn’t sound the same when I say it out loud.

Dr. Elm: What doesn’t?

Daniel: The truth.

[NOTE: Subject no longer disputes involvement. Emotional response minimal.]`
};

setTimeout(()=>{
typeText(
document.getElementById('transHeader'),
'TRANSCRIPT ARCHIVE\nCase File: Daniel Reeves\nStatus: Active Evaluation',
20

},1000);

function openTranscript(id){

if(pass==='3801'){

const restricted=`CLEARANCE LEVEL: RESTRICTED

FILE: INTERNAL REVIEW SUBJECT: Daniel Stevenson AUTHORIZED PERSONNEL ONLY

INTERNAL NOTE:

ANOMALY REPORT:

SUPPLEMENTAL INTERVIEW EXCERPT:

el.innerHTML='';

let lines=boot.split('\n');
let i=0;

function nextLine(){
if(i<lines.length){
el.innerHTML += lines[i] + '\n';
i++;
setTimeout(nextLine,40);
}else{
setTimeout(()=>{
el.innerHTML='Access Granted';

setTimeout(()=>{

typeText(el,restricted,5,()=>{

setTimeout(()=>{


setTimeout(()=>{
el.innerHTML=`[Audio_File_Detected]

[Session_38_Audio]

<button onclick="playAudio('Restricted.mp3')">Play Audio</button>`;

</script>
