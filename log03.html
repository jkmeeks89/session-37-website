    const body = `SESSION ID: 19
DATE: October 3
TIME: 2:18 PM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm


Dr. Elm: You said things were “getting loud.” Can you explain that?

Daniel: It wasn’t loud like yelling.

Dr. Elm: Then how?

Daniel: It was constant.

Dr. Elm: What was?

Daniel: The sound.

Dr. Elm: What sound?

Daniel: Crying.

[Pause — 4 seconds]

Dr. Elm: From who?

Daniel: All of them.

Dr. Elm: Your children?

Daniel: Yes.

Dr. Elm: And your wife?

Daniel: Yes.

Dr. Elm: What did you do?

Daniel: I tried to calm them down.

Dr. Elm: How?

Daniel: I told them everything was fine.

Dr. Elm: Was it?

Daniel: Yes.

[Pause — 6 seconds]

Dr. Elm: Daniel.

Daniel: It was supposed to be.

Dr. Elm: What happened after you tried to calm them?

Daniel: [INAUDIBLE]

Dr. Elm: Can you repeat that?

Daniel: I don’t want to.

Dr. Elm: Why not?

Daniel: Because you’ll hear it wrong.

Dr. Elm: Try anyway.

Daniel: [REDACTED]

[Pause — 10 seconds]

Dr. Elm: Did anyone try to leave?

Daniel: No.

Dr. Elm: Are you sure?

Daniel: Yes.

[NOTE: Audio irregularities reported during this segment. Not present during live session.]`;
