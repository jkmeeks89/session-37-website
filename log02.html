    const body = `SESSION ID: 12
DATE: September 26
TIME: 11:42 AM

SUBJECT: Daniel Stevenson
INTERVIEWER: Dr. Victor Elm


Dr. Elm: Last time you mentioned your family witnessing something. Do you remember more now?

Daniel: Pieces.

Dr. Elm: Let’s go through it slowly.

Daniel: They came in too early.

Dr. Elm: Into what?

Daniel: The room.

Dr. Elm: Which room?

Daniel: [INAUDIBLE]

Dr. Elm: You can say it.

Daniel: I’d rather not.

Dr. Elm: Why?

Daniel: Because it makes it sound worse than it was.

[Pause — 5 seconds]

Dr. Elm: What did they see?

Daniel: The girl.

Dr. Elm: Doing what?

Daniel: Nothing.

Dr. Elm: Daniel—

Daniel: She wasn’t doing anything.

[Pause — 3 seconds]

Dr. Elm: What was your family’s reaction?

Daniel: They were scared.

Dr. Elm: Of you?

Daniel: I don’t know.

Dr. Elm: You said before they “didn’t understand.” What didn’t they understand?

Daniel: That it wasn’t what it looked like.

Dr. Elm: And what did it look like?

Daniel: [REDACTED]

[Pause — 8 seconds]

Dr. Elm: What happened next?

Daniel: I told them to stop.

Dr. Elm: Stop what?

Daniel: Talking. Crying. Moving.

Dr. Elm: Why?

Daniel: Because it was getting loud.

[NOTE: Subject shows increased agitation when discussing auditory elements.]`;
